services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    environment:
      - DEBUG=1
    command: >
      sh -c "uv run python src/manage.py migrate &&
             uv run python src/manage.py runserver 0.0.0.0:8000"

volumes:
  sqlite_data:
